<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081312">
  <meta name="robots" content="noindex">
  <title>Page introuvable — Enzo ATTICOT</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #081312;
      color: #edf1e8;
      font-family: "Aptos", "Gill Sans", "Trebuchet MS", sans-serif;
    }
    main {
      width: min(720px, calc(100% - 40px));
      padding: 48px;
      border: 1px solid rgba(82, 212, 189, .35);
      box-shadow: 14px 14px 0 rgba(82, 212, 189, .08);
    }
    p:first-child {
      color: #52d4bd;
      font-family: "Cascadia Code", "Courier New", monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 18px 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(48px, 10vw, 84px);
      font-weight: 400;
      letter-spacing: -.05em;
      line-height: .95;
    }
    p { color: #c5cec2; }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 18px;
      background: #52d4bd;
      color: #081312;
      font-family: "Cascadia Code", "Courier New", monospace;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    a:focus-visible { outline: 3px solid #f2a65a; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p>Erreur 404</p>
    <h1>Cette page n’existe pas.</h1>
    <p>Le lien a peut-être changé. Le portfolio principal reste accessible.</p>
    <a href="/">Revenir au portfolio</a>
  </main>
</body>
</html>
